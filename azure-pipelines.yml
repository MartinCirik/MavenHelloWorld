trigger:
- master

pool:
  vmImage: 'windows-latest'

steps:
- task: MavenAuthenticate@0
  inputs:
    artifacts: true

- script: |
    mvn package -f MavenHelloWorld-master/pom.xml
  displayName: 'Automatický Maven Build v cloude'

- task: CopyFiles@2
  inputs:
    SourceFolder: 'MavenHelloWorld-master'
    Contents: '**/*.war'
    TargetFolder: '$(build.artifactstagingdirectory)'
  displayName: 'Kopírovanie vygenerovaného .war súboru'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'warfile'
    publishLocation: 'Container'
  displayName: 'Publikovanie Artifactu do Azure Pipelines11'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'TestNG'
    testResultsFiles: '**/target/surefire-reports/testng-results.xml'
  displayName: 'Zobrazenie výsledkov testov na webe'
